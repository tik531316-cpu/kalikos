<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalikos TV Hub</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .counter-box {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            width: 80%;
            max-width: 400px;
            border: 1px solid #333;
        }
        .counter-number {
            font-size: 2.5em;
            color: #4CAF50;
            font-weight: bold;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>مرحباً بك في Kalikos TV</h1>
    <p>لوحة التحكم ونظام العداد التلقائي</p>

    <!-- العداد التلقائي الذي يزداد وحده -->
    <div class="counter-box">
        <h3>عداد المشاهدات المباشر</h3>
        <div id="liveCounter" class="counter-number">1540</div>
    </div>

    <!-- زر القفل أو لوحة التحكم -->
    <div class="counter-box">
        <h3>إدارة المشرف</h3>
        <button onclick="checkAdmin()">فتح لوحة التحكم (Admin)</button>
    </div>

    <script>
        // دالة العداد التلقائي الذي يزيد وحده كل ثانيتين
        setInterval(() => {
            const counterElement = document.getElementById('liveCounter');
            let currentValue = parseInt(counterElement.innerText);
            // يزيد رقماً عشوائياً بين 1 و 5 لتبدو حركة حقيقية
            currentValue += Math.floor(Math.random() * 5) + 1;
            counterElement.innerText = currentValue;
        }, 2000);

        // دالة التحقق من كلمة السر للمشرف
        function checkAdmin() {
            let password = prompt("الرجاء إدخال كلمة سر المشرف:");
            if (password === "admin2008") {
                alert("مرحباً بك! تم تسجيل الدخول بنجاح كمدير.");
                // يمكنك هنا إضافة توجيه للوحة التحكم الخاصة بك
            } else if (password !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        }
    </script>

</body>
</html>
